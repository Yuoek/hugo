
{{ if .Store.Get "enableMermaid" }}
<script type="module">
import mermaid from '/renderjs/mermaid/dist/mermaid.esm.min.js';
mermaid.initialize({startOnLoad:false,theme:"default",securityLevel:"loose",flowchart:{useMaxWidth:false,curve:"basis"}});
async function render(){
  for(const el of document.querySelectorAll(".mermaid-shortcode")){
    el.outerHTML=`<div class="mermaid">${el.textContent}</div>`;
  }
  await mermaid.run({querySelector:".mermaid"});
}
document.readyState==="loading"?document.addEventListener("DOMContentLoaded",render):render();
</script>
<style>.mermaid{overflow:auto;text-align:center;margin:1rem 0}.mermaid svg{display:block;margin:auto;max-width:100%}</style>
{{ end }}
